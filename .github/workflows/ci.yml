name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the version in package.json's packageManager
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build

  # Uploads a version under a per-PR alias without touching production
  # https://developers.cloudflare.com/workers/configuration/previews/
  preview:
    needs: check
    # Secrets aren't available to forks or Dependabot, so skip those
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - id: upload
        run: |
          bunx wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" | tee wrangler.log
          url=$(grep -oE 'https://pr-${{ github.event.pull_request.number }}-[^ ]+\.workers\.dev' wrangler.log | head -1)
          # Wrangler skips the preview URL when previews are off for the Worker, so fail instead of leaving a stale link
          if [ -z "$url" ]; then
            echo "::error::No preview URL in the upload output. Check that preview URLs are enabled for the Worker."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # Keeps a single comment per PR up to date instead of adding one per push
      - if: steps.upload.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none --body \
            "Preview deployed to ${{ steps.upload.outputs.url }} (${{ github.event.pull_request.head.sha }})"

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://violetcaulfield.com
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run deploy
